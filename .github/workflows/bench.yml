name: Benchmarks

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      quota_ms:
        description: Bechamel sampling quota per scenario in milliseconds
        required: false
        default: "500"
        type: string
      sample_limit:
        description: Maximum Bechamel samples per scenario
        required: false
        default: "2000"
        type: string
      allocation_runs:
        description: Operations in each GC allocation batch
        required: false
        default: "10000"
        type: string
      repetitions:
        description: Isolated child-process repetitions per scenario
        required: false
        default: "5"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BENCH_QUOTA_MS: ${{ github.event_name == 'workflow_dispatch' && inputs.quota_ms || '500' }}
  BENCH_SAMPLE_LIMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.sample_limit || '2000' }}
  BENCH_ALLOCATION_RUNS: ${{ github.event_name == 'workflow_dispatch' && inputs.allocation_runs || '10000' }}
  BENCH_REPETITIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.repetitions || '5' }}

jobs:
  bench:
    name: Observe benchmark measurements
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout tree
        uses: actions/checkout@v6

      - name: Set-up OCaml 5
        uses: ./.github/actions/setup-ocaml
        with:
          ocaml-compiler: "5"

      - name: Use opam archive cache
        run: opam option --global 'archive-mirrors=["https://opam.ocaml.org/cache"]'

      - name: Install benchmark dependencies
        run: opam install --yes --with-dev-setup --deps-only .

      - name: Run benchmark tool
        run: |
          opam exec -- dune exec bench/observe_bench.exe -- \
            --quota-ms "$BENCH_QUOTA_MS" \
            --limit "$BENCH_SAMPLE_LIMIT" \
            --allocation-runs "$BENCH_ALLOCATION_RUNS" \
            --repetitions "$BENCH_REPETITIONS" \
            --commit "$GITHUB_SHA" \
            --output ".logs/benchmarks/observe-$GITHUB_SHA.json"

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: observe-benchmark-${{ github.sha }}
          path: .logs/benchmarks/*.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
