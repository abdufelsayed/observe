name: Stress tests

on:
  workflow_dispatch:
    inputs:
      qcheck_count:
        description: QCheck count
        required: false
        default: "2000"
        type: string
      race_trials:
        description: I/O publication race trials
        required: false
        default: "100"
        type: string
      concurrency_work:
        description: Concurrent offers per conservation scenario
        required: false
        default: "64"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  OCAML_LATEST: "5"
  OBSERVE_STRESS_QCHECK_COUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.qcheck_count || '2000' }}
  OBSERVE_STRESS_RACE_TRIALS: ${{ github.event_name == 'workflow_dispatch' && inputs.race_trials || '100' }}
  OBSERVE_STRESS_CONCURRENCY_WORK: ${{ github.event_name == 'workflow_dispatch' && inputs.concurrency_work || '64' }}

jobs:
  stress:
    name: Stress tests
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout tree
        uses: actions/checkout@v6

      - name: Set-up OCaml ${{ env.OCAML_LATEST }}
        uses: ./.github/actions/setup-ocaml
        with:
          ocaml-compiler: ${{ env.OCAML_LATEST }}

      - name: Use opam archive cache
        run: opam option --global 'archive-mirrors=["https://opam.ocaml.org/cache"]'

      - name: Install stress test dependencies
        run: opam install --yes --with-test --with-doc --with-dev-setup --deps-only .

      - name: Run no-service stress tests
        env:
          OBSERVE_QCHECK_COUNT: ${{ env.OBSERVE_STRESS_QCHECK_COUNT }}
          OBSERVE_RACE_TRIALS: ${{ env.OBSERVE_STRESS_RACE_TRIALS }}
          OBSERVE_CONCURRENCY_WORK: ${{ env.OBSERVE_STRESS_CONCURRENCY_WORK }}
        run: scripts/test.sh stress --label manual-stress

      - name: Upload stress test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-test-report
          path: .logs/
          if-no-files-found: ignore
          include-hidden-files: true
